<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>moogleAPI — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&family=Raleway:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/dashboard/app.css?v=20260812" />
</head>
<body>

<header>
  <div class="header-left">
    <a class="header-brand" href="/">⬡ moogleAPI</a>
    <span class="header-title">Dashboard</span>
    <a class="header-link" href="/stats">Stats →</a>
  </div>
  <div class="header-right">
    <form method="post" action="/signout" style="display:inline">
      <button class="btn-signout" type="submit">Sign Out</button>
    </form>
  </div>
</header>

<main>
  <div id="error-banner"></div>
  <div id="toast"></div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="characters" aria-selected="true">
      Characters<span class="tab-count" id="count-characters"></span>
    </button>
    <button class="tab" role="tab" data-tab="monsters" aria-selected="false">
      Monsters<span class="tab-count" id="count-monsters"></span>
    </button>
    <button class="tab" role="tab" data-tab="games" aria-selected="false">
      Games<span class="tab-count" id="count-games"></span>
    </button>
  </div>

  <div class="toolbar">
    <input type="search" id="search" placeholder="Search by name…" autocomplete="off" />
    <select id="game-filter"><option value="">All games</option></select>
    <select id="page-size">
      <option value="25">25 / page</option>
      <option value="50" selected>50 / page</option>
      <option value="100">100 / page</option>
      <option value="200">200 / page</option>
    </select>
    <button class="btn btn-primary" id="new-row" type="button">+ New</button>
    <button class="btn" id="import-open" type="button">Import from wiki…</button>
    <div class="toolbar-spacer"></div>
    <span class="result-count" id="result-count"></span>
    <div class="pager">
      <button class="pager-prev" type="button">‹ Prev</button>
      <span class="page-label">—</span>
      <button class="pager-next" type="button">Next ›</button>
    </div>
  </div>

  <div class="table-wrap" id="table-wrap">
    <table>
      <thead><tr id="thead-row"></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="pager pager-bottom" id="pager-bottom">
    <button class="pager-prev" type="button">‹ Prev</button>
    <span class="page-label">—</span>
    <button class="pager-next" type="button">Next ›</button>
  </div>
</main>

<!-- Zoom -->
<div class="overlay" id="zoom" role="dialog" aria-modal="true" aria-labelledby="zoom-title">
  <div class="panel">
    <button class="panel-close" id="zoom-close" type="button" aria-label="Close">×</button>
    <div class="panel-title" id="zoom-title"></div>
    <div class="panel-sub" id="zoom-sub"></div>
    <img id="zoom-img" alt="" />
    <div class="zoom-switch" id="zoom-switch"></div>
    <a class="zoom-link" id="zoom-link" target="_blank" rel="noopener"></a>
  </div>
</div>

<!-- Editor -->
<div class="overlay" id="editor" role="dialog" aria-modal="true" aria-labelledby="editor-title">
  <div class="panel">
    <button class="panel-close" id="editor-close" type="button" aria-label="Close">×</button>
    <div class="panel-title" id="editor-title"></div>
    <div class="panel-sub" id="editor-sub"></div>
    <div class="editor-error" id="editor-error"></div>
    <form id="editor-form" autocomplete="off">
      <div class="field-grid" id="editor-fields"></div>
      <div id="editor-art-wrap" hidden>
        <div class="section-head">Artwork</div>
        <div class="art-grid" id="editor-art"></div>
        <div class="field-grid" id="editor-art-extra"></div>
      </div>
    </form>
    <div class="editor-foot">
      <button class="btn btn-primary" id="editor-save" type="button">Save changes</button>
      <button class="btn" id="editor-cancel" type="button">Cancel</button>
      <div class="spacer"></div>
      <button class="btn btn-danger" id="editor-delete" type="button">Delete row</button>
    </div>
  </div>
</div>

<!-- Import -->
<div class="overlay" id="import" role="dialog" aria-modal="true" aria-labelledby="import-title">
  <div class="panel">
    <button class="panel-close" id="import-close" type="button" aria-label="Close">&times;</button>
    <div class="panel-title" id="import-title">Import from the wiki</div>
    <div class="panel-sub">
      Reads one article and opens it as a draft. Nothing is saved until you review it and hit Save.
    </div>
    <div class="editor-error" id="import-error"></div>
    <div class="field-grid">
      <div class="field wide">
        <label for="import-page">Article URL or title</label>
        <input type="text" id="import-page" placeholder="https://finalfantasy.fandom.com/wiki/Astos" />
      </div>
      <div class="field">
        <label for="import-resource">Import as</label>
        <select id="import-resource">
          <option value="characters">Character</option>
          <option value="monsters">Monster</option>
        </select>
      </div>
      <div class="field">
        <label for="import-game">Game</label>
        <select id="import-game"></select>
      </div>
    </div>
    <div class="editor-foot">
      <button class="btn btn-primary" id="import-go" type="button">Fetch draft</button>
      <button class="btn" id="import-cancel" type="button">Cancel</button>
    </div>
  </div>
</div>

<!-- Confirm -->
<div class="overlay" id="confirm" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
  <div class="panel">
    <div class="panel-title" id="confirm-title">Delete this row?</div>
    <div class="panel-sub"></div>
    <div class="panel-body" id="confirm-body"></div>
    <div class="confirm-actions">
      <button class="btn" id="confirm-no" type="button">Cancel</button>
      <button class="btn btn-danger" id="confirm-yes" type="button">Delete</button>
    </div>
  </div>
</div>

<script src="/dashboard/app.js?v=20260812"></script>

</body>
</html>
