<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kupodle — moogleAPI</title>
  <meta name="description" content="Guess the daily Final Fantasy character in six tries." />
  <!-- The wiki CDN hotlink-blocks any request carrying a Referer (404s even for moogleapi.com),
       so portraits only load if we send none. -->
  <meta name="referrer" content="no-referrer" />
  <link rel="icon" href="/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&family=Raleway:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/games.css?v=20260802b" />
  <style>
    /* ── Kupodle ──
       A puzzle board, so the page is built like one: squared corners everywhere, a faint grid
       ruled across the background, and the panels flattened so nothing casts a shadow the tiles
       don't. The guess grid is the only thing on screen a player reads carefully, and every
       rounded, floating, gradient-filled element was competing with it for attention. */
    body {
      --bg:        #1c2220;
      --surface:   #26302c;
      --surface-2: #1f2825;
      --border:    #3b4a44;
      --accent:    #7cc4a4;
      --accent-2:  #cdeadd;
      --gold:      #d8e8b0;
      --muted:     #8fa89c;
      --nav-bg:    rgba(28, 34, 32, 0.92);
      --radius:    2px;

      background-color: var(--bg);
      /* Layered back to front: the gallery wall, then the ruled paper over it.
         
         The ruling is not decorative — it reads as squared paper and sets the grid's rhythm
         before the board has loaded — and it stays on top of the photograph rather than under
         it, because the wall in that picture has the same faint ruling painted on and the two
         lining up is the point. Two hairlines rather than a texture, so it costs nothing.

         The artwork is the same picture /games/ crops its Kupodle tile from: a wall of framed
         portraits, every one of them a silhouette but the lit one. A missing file simply does
         not paint, so this degrades to exactly the ruled paper it was before. */
      background-image:
        linear-gradient(rgba(124,196,164,0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(124,196,164,0.045) 1px, transparent 1px),
        url('/assets/backgrounds/kupodle.webp');
      background-size: 44px 44px, 44px 44px, cover;
      background-position: 0 0, 0 0, center top;
      background-repeat: repeat, repeat, no-repeat;
      background-attachment: fixed;
    }

    /* Keeps the wall from competing with the board. Sits under everything and over the
       background, and is the one knob to turn if the artwork reads too strong — the same veil
       Battle Square and Kupo Climb use, at the same strength.

       It matters more here than on those pages: the one lit frame in that picture is the
       brightest thing on the screen otherwise, and the puzzle's own tiles have to win. */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(20,26,24,0.74) 0%, rgba(20,26,24,0.88) 55%, rgba(20,26,24,0.94) 100%);
    }

    .page-title {
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent-2);
    }
    .page-sub { letter-spacing: 0.01em; }

    /* Flat and squared. A puzzle board is a grid of equal cells; a panel with a soft radius and
       a drop shadow reads as a card sitting on top of one. */
    .panel { box-shadow: none; }
    .btn { border-radius: 2px; letter-spacing: 0.06em; text-transform: uppercase; font-size: 0.82rem; }
    input[type="text"], select { border-radius: 2px; }
    .stat { border-radius: 2px; }

    /* The frame sits beside the input, and the suggestion list has to stay pinned to the input
       rather than to the whole panel — hence .combo-fields taking over as the positioning
       context that .combo used to be. */
    .combo { position: relative; display: flex; align-items: flex-start; gap: 0.9rem; }
    .combo-fields { position: relative; flex: 1; min-width: 0; }
    .combo-row { display: flex; gap: 0.6rem; }
    .combo-row input { flex: 1; }

    /* ── The answer frame ──────────────────────────────────────────────────────
     * A picture frame on the study wall, holding the day's character in shadow until the puzzle
     * is over, then lighting them up. It matches the wall behind the page — a gallery of framed
     * portraits, every one of them a silhouette but the lit one.
     *
     * The shadow is a purpose-drawn picture, not the artwork dimmed. Dimming was tried and cannot
     * work: the illustration is a full painted scene, so darkening it far enough to hide the
     * character leaves a black rectangle, and not far enough leaves Vivi's hat and Cloud's sword
     * plainly readable — and the background gives away the game before the first guess either
     * way, which is half the puzzle. So each pool character has a second image, black on a pale
     * field with nothing behind it, served by the byte from /characters/daily/silhouette.
     */
    /* Bronze rather than the page's green, and gilt rather than flat.
     *
     * The wall behind this page is a photograph of framed portraits and those frames are warm, so
     * a green frame was the one thing on screen pretending not to be part of the picture. Warm
     * against the cool ground also does the job the old frame could not: it separates the artwork
     * from the panel behind it, and it throws the black silhouette forward instead of letting it
     * sit flat in a green rectangle.
     *
     * Four layers make it read as carved moulding rather than as a coloured border, and each is
     * doing a different job — a single gradient at this size just looks brown:
     *   1. reeding, fine ridges catching the same light as the bevel;
     *   2. a bevel, light off the top-left shoulder and shade into the bottom-right;
     *   3. a rebate, the step down from the moulding to the glass;
     *   4. the ornament itself — chocobo scrollwork and corner moogles, below.
     */
    .answer-frame {
      position: relative;
      flex: none;
      /* 8rem with a 20px moulding, which is what the ornament costs. Below about twenty pixels a
         moogle's pom merges with its head and a chocobo becomes a lump — tested at 12, 16, 20 and
         26 before settling here. The picture grew with it rather than shrinking to pay for the
         carving, so the reveal at the end of a puzzle lands harder than it did. */
      width: 8rem;
      padding: 20px;
      margin: 0;
      border-radius: 4px;
      background:
        repeating-linear-gradient(58deg,
          rgba(255, 226, 176, 0.15) 0 1px,
          rgba(0, 0, 0, 0.13) 1px 3px),
        linear-gradient(145deg,
          #e6c184 0%, #b3813f 26%, #7c5527 52%, #a8763a 74%, #4d3317 100%);
      box-shadow:
        0 7px 18px rgba(0, 0, 0, 0.55),
        inset 0 0 0 1px rgba(255, 228, 178, 0.42),
        inset 0 3px 4px rgba(255, 226, 176, 0.22),
        inset 0 -3px 5px rgba(0, 0, 0, 0.45);
    }

    /* The rebate — the step down from the moulding to the glass. One dark line with one light one
       inside it is the whole trick: it reads as a lip with depth where a plain border reads as
       print. */
    .answer-frame::before {
      content: '';
      position: absolute;
      inset: 15px;
      border-radius: 2px;
      pointer-events: none;
      box-shadow:
        0 0 0 1px rgba(46, 30, 14, 0.9),
        inset 0 0 0 1px rgba(255, 224, 170, 0.26);
    }

    /* Chocobo scrollwork down every side, a moogle at each corner.
     *
     * Separate SVG files rather than data URIs. This stylesheet is inline in the page and the page
     * is served no-cache, so 40 KB of encoded SVG would have been paid for on every single load;
     * as files they fall under the static-asset rule and are cached for thirty days. A missing one
     * simply does not paint, and the frame degrades to plain bronze.
     *
     * The corners are listed FIRST because CSS paints background layers front to back — so the
     * moogles sit over the running scroll and hide the point where each repeat is cut off.
     *
     * All five are generated from one geometry description, so the four edges are the same drawing
     * rotated and mirrored rather than four drawings kept in step by hand. See
     * assets/frames/README.md.
     */
    .answer-frame::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 4px;
      pointer-events: none;
      background-image:
        url('/assets/frames/moogle-corner.svg'),
        url('/assets/frames/moogle-corner.svg'),
        url('/assets/frames/moogle-corner.svg'),
        url('/assets/frames/moogle-corner.svg'),
        url('/assets/frames/chocobo-top.svg'),
        url('/assets/frames/chocobo-bottom.svg'),
        url('/assets/frames/chocobo-left.svg'),
        url('/assets/frames/chocobo-right.svg');
      background-position:
        left top, right top, left bottom, right bottom,
        20px top, 20px bottom, left 20px, right 20px;
      background-size:
        20px 20px, 20px 20px, 20px 20px, 20px 20px,
        32px 20px, 32px 20px, 20px 32px, 20px 32px;
      background-repeat:
        no-repeat, no-repeat, no-repeat, no-repeat,
        repeat-x, repeat-x, repeat-y, repeat-y;
    }

    .answer-frame-inner {
      position: relative;
      aspect-ratio: 3 / 4;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #1a211e;
      box-shadow: inset 0 0 0 1px #101512, inset 0 2px 10px rgba(0, 0, 0, 0.7);
    }
    /* The glass. A single raking highlight is what reads as something being behind glass. */
    .answer-frame-inner::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(122deg, rgba(255, 255, 255, 0.11) 0%, rgba(255, 255, 255, 0.03) 38%, transparent 39%);
    }
    .answer-frame img { width: 100%; height: 100%; object-fit: cover; object-position: center 12%; display: block; }
    /* The portrait is cropped to the head; the silhouette is already framed as it should be, so
       it is fitted whole rather than pushed up and cut — the shape IS the clue, and a cropped
       outline is a different outline. */
    .answer-frame img.silhouette { object-fit: contain; object-position: center; }

    /* The silhouette is stored as a transparent matte, so this well is what shows through it.
       It cannot be the one the question mark sits on: #1a211e is near-black and a black figure
       disappears into it. So the well lifts to the frame's own border tone while a shape is
       hanging in it, and drops back to near-black for the question mark and the final portrait. */
    .answer-frame-inner.has-silhouette { background: var(--border); }
    .answer-frame-q {
      font-family: 'Josefin Sans', sans-serif;
      font-size: 1.7rem;
      font-weight: 700;
      color: rgba(216, 232, 176, 0.3);
      line-height: 1;
    }

    /* Narrow screens stack rather than shrink.
     *
     * Beside the input a frame this size would leave the guess field a stub, and shrinking the
     * frame instead — which is what this rule used to do — thins the moulding until the carving
     * reads as grit. Stacked, both get the full width and the ornament survives at full size.
     * This is the better mobile layout irrespective of the frame: a full-width guess field is what
     * a phone wants. */
    @media (max-width: 560px) {
      .combo { flex-direction: column; align-items: center; }
      .combo-fields { width: 100%; }
      .answer-frame { width: 9rem; }
    }

    .suggestions {
      position: absolute; z-index: 30; top: calc(100% + 4px); left: 0; right: 0;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); max-height: 300px; overflow-y: auto;
      list-style: none; box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    }
    .suggestions:empty, .suggestions[hidden] { display: none; }
    .suggestions li {
      display: flex; align-items: center; gap: 0.7rem;
      padding: 0.5rem 0.75rem; cursor: pointer;
    }
    .suggestions li[aria-selected="true"], .suggestions li:hover { background: var(--surface-2); }
    .suggestions img {
      width: 34px; height: 42px; object-fit: cover; object-position: center 12%;
      border-radius: 4px; flex-shrink: 0;
    }
    .suggestions .sg { color: var(--muted); font-size: 0.8rem; margin-left: auto; }

    .guesses { display: flex; flex-direction: column; gap: 0.75rem; margin-top: 1.5rem; }
    .guess {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 0.75rem;
    }
    .guess-head { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.6rem; }
    .guess-head img {
      width: 52px; height: 66px; object-fit: cover; object-position: center 12%;
      border-radius: 6px; border: 1px solid var(--border); flex-shrink: 0;
    }
    .guess-name { font-family: 'Josefin Sans', sans-serif; font-weight: 600; font-size: 1.05rem; }
    .guess-no { margin-left: auto; color: var(--muted); font-size: 0.8rem; font-family: 'JetBrains Mono', monospace; }

    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 0.5rem; }
    .tile {
      border-radius: 6px; padding: 0.45rem 0.6rem;
      border: 1px solid transparent; min-width: 0;
    }
    .tile .k {
      font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.08em;
      opacity: 0.75; display: block;
    }
    /* Some roles are genuinely long ("Commodore of the Third Army Corps 87th Airborne Unit").
       Clamp to three lines so one verbose attribute can't stretch the whole row; the full
       text stays available via the tile's title/aria-label. */
    .tile .v {
      font-size: 0.85rem; font-weight: 600;
      overflow-wrap: anywhere;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .tile.hit  { background: var(--hit);  color: var(--hit-text);  border-color: #3d9e6b; }
    .tile.miss { background: var(--miss); color: var(--miss-text); border-color: #6b3d47; }
    .tile.near { background: var(--near); color: var(--near-text); border-color: #b8912c; }

    .result {
      margin-top: 1.5rem; padding: 1.25rem; border-radius: var(--radius);
      border: 1px solid var(--border); background: var(--surface); text-align: center;
    }
    .result h2 { font-family: 'Josefin Sans', sans-serif; color: var(--gold); margin-bottom: 0.5rem; }
    .result img {
      width: 132px; height: 176px; object-fit: cover; object-position: center 12%;
      border-radius: 8px; border: 2px solid var(--border);
      margin: 0.75rem auto; display: block;
    }
    .result .actions { display: flex; gap: 0.6rem; justify-content: center; margin-top: 1rem; flex-wrap: wrap; }
    .share-grid {
      font-family: 'JetBrains Mono', monospace; font-size: 1.1rem;
      line-height: 1.35; margin: 0.75rem 0; letter-spacing: 0.1em;
      overflow-x: auto;
    }

    .footnote {
      text-align: center; font-size: 0.78rem; color: var(--muted);
      margin-top: 0.85rem; line-height: 1.5;
    }
    .footnote strong { color: var(--gold); font-weight: 600; }
    .footnote:empty { display: none; }

    @media (max-width: 560px) {
      /* Two tiles per row keeps the attribute values readable rather than truncating
         long hometowns and affiliations to a few characters. */
      .tiles { grid-template-columns: repeat(2, 1fr); gap: 0.35rem; }
      .tile { padding: 0.35rem 0.45rem; }
      .tile .v { font-size: 0.78rem; }
      .guess { padding: 0.6rem; }
      .guess-head img { width: 44px; height: 56px; }
      .guess-name { font-size: 0.95rem; }
      .share-grid { font-size: 0.95rem; }
      .result img { width: 112px; height: 150px; }
      .suggestions img { width: 30px; height: 38px; }
      /* The game name has to stay: several characters share a name across titles, and it's
         the only thing distinguishing them in the list. */
      .suggestions li { gap: 0.45rem; padding: 0.5rem 0.6rem; }
      .suggestions .sg { font-size: 0.68rem; flex-shrink: 0; max-width: 42%; overflow: hidden;
                         text-overflow: ellipsis; white-space: nowrap; }
    }
  </style>
</head>
<body>
  <nav>
    <a class="nav-brand" href="/"><img src="/assets/moogle.png" alt="" /> moogleAPI</a>
    <div class="nav-links">
      <a class="nav-back" href="/games">← Games</a>
    </div>
  </nav>

  <main class="wrap">
    <h1 class="page-title">Kupodle</h1>
    <p class="page-sub">
      Guess the daily Final Fantasy character in six tries.
      Every attribute you match lights up — <strong>↑</strong> and <strong>↓</strong> point toward the answer's release year.
    </p>

    <div id="boot" class="loading">Loading today's puzzle…</div>

    <section id="game" hidden>
      <div class="panel combo">
        <!-- Holds the day's silhouette while the puzzle is on, then the character. The question
             mark is the fallback for a pool row whose shape has not been drawn yet. -->
        <figure id="answer-frame" class="answer-frame">
          <div class="answer-frame-inner">
            <span class="answer-frame-q" aria-hidden="true">?</span>
          </div>
        </figure>
        <div class="combo-fields">
          <label class="visually-hidden" for="guess-input">Character name</label>
          <div class="combo-row">
            <input id="guess-input" type="text" autocomplete="off" spellcheck="false"
                   placeholder="Name a character…" role="combobox"
                   aria-expanded="false" aria-controls="suggestions" aria-autocomplete="list" />
            <button id="submit" class="btn" disabled>Guess</button>
          </div>
          <ul id="suggestions" class="suggestions" role="listbox" aria-label="Character suggestions" hidden></ul>
        </div>
      </div>

      <p id="status" class="status" role="status" aria-live="polite"></p>
      <div id="guesses" class="guesses"></div>
      <div id="result" class="result" hidden></div>

      <p class="stats-label">Your record</p>
      <div id="stats" class="stats"></div>

      <p id="countdown" class="footnote"></p>
      <p id="yesterday" class="footnote"></p>
    </section>
  </main>

  <script src="/assets/stats.js?v=20260802b"></script>
  <script src="/kupodle/game.js?v=20260810"></script>
</body>
</html>
