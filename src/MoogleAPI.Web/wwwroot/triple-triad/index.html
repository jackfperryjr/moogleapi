<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Triple Triad — moogleAPI</title>
  <meta name="description" content="Play Triple Triad with the authentic Final Fantasy VIII card set." />
  <!-- The wiki CDN hotlink-blocks any request carrying a Referer (404s even for moogleapi.com),
       so card art only loads if we send none. Page-level because the card faces are CSS
       background images, which a per-element referrerpolicy attribute cannot cover. -->
  <meta name="referrer" content="no-referrer" />
  <link rel="icon" href="/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&family=Raleway:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/games.css?v=20260802b" />
  <style>
    /* ── Triple Triad ──
       Final Fantasy VIII's menus are translucent blue panels with a hairline border and a thin
       inner glow, and the game is played on felt. So: a felt-green table under a blue interface,
       panels that look lit from within rather than filled, and a serif face for headings — the
       one game here whose source material is a card, and cards have typography. */
    body {
      --bg:        #10231c;
      --surface:   rgba(22, 54, 92, 0.82);
      --surface-2: rgba(14, 38, 68, 0.85);
      --border:    #4d7fb5;
      --accent:    #5b9bd5;
      --accent-2:  #cfe4f7;
      --gold:      #e8d9a0;
      --muted:     #93b2ce;
      --nav-bg:    rgba(11, 30, 52, 0.92);
      --radius:    6px;

      /* Felt, and now actual felt: the painted table sits over the gradient that used to be the
         whole effect, so a slow connection still gets a green table rather than a black page.
         Same picture the /games/ tile is cropped from, and the lamp in its upper right is why the
         gradient's highlight was moved off centre to meet it. */
      background:
        url('/assets/backgrounds/triple-triad-table.webp') center/cover no-repeat fixed,
        radial-gradient(ellipse 90% 70% at 68% 22%, #1c4034 0%, #12271f 55%, #0c1a15 100%)
        fixed;
    }

    .page-title {
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 400;
      letter-spacing: 0.04em;
      color: var(--gold);
      text-shadow: 0 2px 12px rgba(0,0,0,0.5);
    }

    /* The FFVIII menu panel: translucent, hairline bordered, lit from inside. */
    .panel {
      backdrop-filter: blur(3px);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.07), 0 6px 22px rgba(0,0,0,0.4);
    }
    .btn {
      font-family: Georgia, 'Times New Roman', serif;
      letter-spacing: 0.04em;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.10);
    }
    .stat { backdrop-filter: blur(3px); }

    .board-area { display: flex; flex-direction: column; align-items: center; gap: 1rem; }

    .scoreline {
      display: flex; align-items: center; justify-content: center; gap: 1.5rem;
      font-family: 'Josefin Sans', sans-serif; font-size: 1.1rem;
    }
    .score { display: flex; align-items: center; gap: 0.5rem; font-weight: 700; }
    .score .pip { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
    .score.you .pip { background: var(--player); }
    .score.cpu .pip { background: var(--opponent); }
    .score.turn { color: var(--gold); }

    .board {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
      background: var(--border); padding: 6px; border-radius: var(--radius);
      width: min(100%, 400px);
    }
    .cell {
      aspect-ratio: 3 / 4; background: var(--surface-2);
      border-radius: 6px; position: relative;
      display: flex; align-items: center; justify-content: center;
      padding: 0; border: 0; cursor: default;
    }
    .cell.playable { cursor: pointer; outline: 2px dashed var(--accent); outline-offset: -4px; }
    .cell.playable:hover { background: #3a4c56; }
    .cell.dragover {
      background: #3f5560; outline: 3px solid var(--gold); outline-offset: -4px;
    }
    .card.draggable { cursor: grab; }
    .card.dragging { opacity: 0.4; cursor: grabbing; }

    .hand { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; width: min(100%, 560px); }
    .hand .card-slot { width: 84px; }
    .hand-label {
      font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--muted); text-align: center;
    }

    /* ── Card ── */
    .card {
      /* Height reserved for the name strip. The ranks used to be inset by exactly this much so
         the bottom number cleared the title; they sit in the top-left corner now, but the strip
         still needs its height reserved. */
      --name-h: 17px;
      width: 100%; aspect-ratio: 3 / 4; border-radius: 6px; position: relative;
      overflow: hidden; border: 2px solid transparent;
      background-color: var(--surface-2);
      display: block; padding: 0; cursor: inherit;
    }

    /* Card art is a real <img> rather than a CSS background: the background-image form did
       not render the wiki's art here, while the <img> form does. It also lets each request
       carry its own referrerpolicy. */
    .card .art {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; object-position: center top; display: block;
    }
    .card.owner-player   { border-color: #5a9bd8; background-color: var(--player); }
    .card.owner-opponent { border-color: #d4808f; background-color: var(--opponent); }
    .card.selected { outline: 3px solid var(--gold); outline-offset: 1px; }
    .card.selectable { cursor: pointer; }
    /* A real back, not a hatch pattern. Every card in a deck shares one, and the three-pointed
       emblem on it is the game's own name. */
    .card.facedown {
      background: #14294a url('/assets/card-back.webp') center/cover no-repeat;
    }

    /* Light enough to read the art through; ownership is carried mainly by the border. */
    .card .tint { position: absolute; inset: 0; opacity: 0.33; }
    .card.owner-player   .tint { background: var(--player); }
    .card.owner-opponent .tint { background: var(--opponent); }

    /* The ranks are drawn here, over the art, and always were — they used to be hidden the
       moment the art loaded because the 1999 card faces have their numbers printed on. The
       regenerated faces are drawn without them, which is the better arrangement in every
       direction: the numbers come from the row rather than from a picture, so they are crisp at
       any size, restyleable, correct by construction, and a diffusion model never has to spell.
       Each still sits on the edge it defends.

       The chip behind each digit is what makes them survive being over artwork instead of over a
       flat panel — a text shadow alone disappeared into a light subject. */
    /* The ranks, in the corner cluster the games have always used: a diamond in the top left,
       top over left-and-right over bottom. Large and white, and smoothed rather than redrawn —
       the 1999 cards printed these into the art with a hard pixel outline, and this is the same
       arrangement rendered as type, so it stays crisp at any size.

       They are live DOM rather than paint, which is the whole reason the faces were regenerated
       without them: the numbers come from the row, so they are correct by construction and no
       model ever has to spell a digit.

       The corner wash is what lets white sit on an unknown painting. A text shadow alone
       disappeared into a light subject, and a chip behind each digit — which is where this
       started — read as UI stuck on top of the art rather than as part of the card. It is a
       background on .vals rather than a pseudo-element: an absolutely positioned ::before paints
       above its in-flow siblings, so it covered the digits, and z-index:-1 sent it behind the
       card entirely because nothing in this subtree creates a stacking context. */
    .card .vals {
      position: absolute;
      top: 0; left: 0;
      display: grid;
      grid-template-columns: repeat(3, 1em);
      grid-template-rows: repeat(3, 0.86em);
      place-items: center;
      /* Padding rather than an offset, so the wash below has somewhere to fade out into. The
         cluster still sits 5px in from the corner. */
      padding: 5px 16px 16px 5px;
      background: radial-gradient(ellipse at top left, rgba(4,10,18,0.78) 0%, rgba(4,10,18,0.32) 54%, transparent 76%);
      font-family: 'Raleway', sans-serif;
      font-weight: 600;
      font-size: 0.92rem;
      line-height: 1;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0,0,0,0.9), 0 0 6px rgba(0,0,0,0.75);
    }
    .card .vals span { position: static; line-height: 1; }
    .card .v-top    { grid-area: 1 / 2; }
    .card .v-left   { grid-area: 2 / 1; }
    .card .v-right  { grid-area: 2 / 3; }
    .card .v-bottom { grid-area: 3 / 2; }

    .card .cname {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: var(--name-h); line-height: var(--name-h);
      font-size: 0.55rem; text-align: center; padding: 0 2px;
      background: rgba(0,0,0,0.72); color: #fff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .card .elem {
      position: absolute; top: 2px; right: 3px; font-size: 0.6rem;
      background: rgba(0,0,0,0.6); border-radius: 3px; padding: 0 3px;
    }

    @keyframes flip { 0% { transform: rotateY(0); } 50% { transform: rotateY(90deg); } 100% { transform: rotateY(0); } }
    .card.flipping { animation: flip 0.4s ease; }

    .controls { display: flex; gap: 0.6rem; justify-content: center; flex-wrap: wrap; margin-top: 1.25rem; }

    /* On a phone five 84px cards plus gaps overflow the viewport, so the hand shrinks to
       fit five across rather than wrapping into an awkward second row. */
    @media (max-width: 560px) {
      .hand { gap: 4px; }
      .hand .card-slot { width: calc((100vw - 2.2rem - 16px) / 5); max-width: 84px; }
      .card { --name-h: 14px; }
      .card .vals { font-size: 0.66rem; }
      .card .cname { font-size: 0.46rem; }
      .card .elem { font-size: 0.5rem; }
      .board { width: min(100%, 320px); }
      .scoreline { gap: 1rem; font-size: 1rem; }
    }

    .outcome {
      text-align: center; padding: 1.25rem; border-radius: var(--radius);
      border: 1px solid var(--border); background: var(--surface); margin-top: 1.25rem;
    }
    .outcome h2 { font-family: 'Josefin Sans', sans-serif; color: var(--gold); }
  </style>
</head>
<body>
  <nav>
    <a class="nav-brand" href="/"><img src="/assets/moogle.png" alt="" /> moogleAPI</a>
    <div class="nav-links">
      <a class="nav-back" href="/games">← Games</a>
    </div>
  </nav>

  <main class="wrap">
    <h1 class="page-title">Triple Triad</h1>
    <p class="page-sub">
      The Final Fantasy VIII card game, with all 110 authentic cards.
      Place a card so its facing number beats your opponent's, and the card flips to your colour.
      Most cards when the board fills wins.
    </p>

    <div id="boot" class="loading">Dealing cards…</div>

    <section id="game" hidden class="board-area">
      <p class="hand-label">Opponent</p>
      <div id="cpu-hand" class="hand"></div>

      <div class="scoreline">
        <span class="score you" id="score-you"><span class="pip"></span> You 5</span>
        <span class="score cpu" id="score-cpu"><span class="pip"></span> CPU 5</span>
      </div>

      <div id="board" class="board"></div>

      <p id="status" class="status" role="status" aria-live="polite"></p>

      <p class="hand-label">Your hand</p>
      <div id="you-hand" class="hand"></div>

      <div id="outcome" class="outcome" hidden></div>

      <div class="controls">
        <button id="new-game" class="btn btn-secondary">New game</button>
      </div>

      <p class="stats-label">Your record</p>
      <div id="stats" class="stats"></div>
    </section>
  </main>

  <script src="/assets/stats.js?v=20260802b"></script>
  <script src="/triple-triad/game.js?v=20260809"></script>
</body>
</html>
