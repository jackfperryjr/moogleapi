<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Triple Triad — moogleAPI</title>
  <meta name="description" content="Play Triple Triad with the authentic Final Fantasy VIII card set." />
  <!-- The wiki CDN hotlink-blocks any request carrying a Referer (404s even for moogleapi.com),
       so card art only loads if we send none. Page-level because the card faces are CSS
       background images, which a per-element referrerpolicy attribute cannot cover. -->
  <meta name="referrer" content="no-referrer" />
  <link rel="icon" href="/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&family=Raleway:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/games.css?v=20260802b" />
  <link rel="stylesheet" href="/triple-triad/style.css?v=20260812" />
</head>
<body>
  <nav>
    <a class="nav-brand" href="/"><img src="/assets/moogle.png" alt="" /> moogleAPI</a>
    <div class="nav-links">
      <a class="nav-back" href="/games">← Games</a>
    </div>
  </nav>

  <main class="wrap">
    <h1 class="page-title">Triple Triad</h1>
    <p class="page-sub">
      The Final Fantasy VIII card game, with all 110 authentic cards.
      Place a card so its facing number beats your opponent's, and the card flips to your colour.
      Most cards when the board fills wins.
    </p>

    <div id="boot" class="loading">Dealing cards…</div>

    <section id="game" hidden class="board-area">
      <p class="hand-label">Opponent</p>
      <div id="cpu-hand" class="hand"></div>

      <div class="scoreline">
        <span class="score you" id="score-you"><span class="pip"></span> You 5</span>
        <span class="score cpu" id="score-cpu"><span class="pip"></span> CPU 5</span>
      </div>

      <div id="board" class="board"></div>

      <p id="status" class="status" role="status" aria-live="polite"></p>

      <p class="hand-label">Your hand</p>
      <div id="you-hand" class="hand"></div>

      <div id="outcome" class="outcome" hidden></div>

      <div class="controls">
        <button id="new-game" class="btn btn-secondary">New game</button>
      </div>

      <p class="stats-label">Your record</p>
      <div id="stats" class="stats"></div>
    </section>
  </main>

  <script src="/assets/stats.js?v=20260802b"></script>
  <script src="/triple-triad/game.js?v=20260809"></script>
</body>
</html>
