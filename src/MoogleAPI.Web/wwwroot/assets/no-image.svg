<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 1024" width="768" height="1024" role="img" aria-label="No artwork">
  <!--
    Stands in for a row with no artwork. Portrait 3:4, matching the generated library, so a card
    laid out for real art does not change shape when one is missing.

    Deliberately quiet: this appears in grids beside finished illustrations, and a loud placeholder
    would read as the more important tile. It is also flat vector rather than a picture, so it
    costs nothing to serve and stays crisp at any card size.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2a33" />
      <stop offset="1" stop-color="#211f28" />
    </linearGradient>
  </defs>

  <rect width="768" height="1024" fill="url(#bg)" />

  <g fill="none" stroke="#5a5668" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <rect x="264" y="404" width="240" height="188" rx="16" />
    <path d="M264 536l62-58 74 62 52-44 52 46" />
    <circle cx="330" cy="452" r="18" />
    <path d="M300 380l168 236" stroke="#7d6a8f" />
  </g>

  <text x="384" y="672" fill="#6f6b7d" font-family="system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="34" font-weight="600" letter-spacing="1.5" text-anchor="middle">No artwork</text>
</svg>
